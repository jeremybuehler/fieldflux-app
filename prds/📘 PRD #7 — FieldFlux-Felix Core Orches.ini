4. Core Responsibilities
Layer	Responsibility
Felix Core	Reason, plan, and execute multi-tool workflows
AgentKit	Expose modular tool APIs (atomic functions)
LearningLoop	Score performance and guide adaptive learning
Supabase	Persist state, telemetry, and long-term context
UI Layer	Display ephemeral interactions + dashboards
5. Functional Overview
Function	Description
handle_event	Receive and route incoming events (e.g., new review, lead, or social request)
plan_actions	Decide which tools to use and in what sequence
execute_task	Call the correct tool functions via AgentKit
observe_outcomes	Collect and log results into LearningLoop
reflect_and_adapt	Adjust reasoning patterns and memory weights
surface_ui	Generate ephemeral cards when human input is needed
6. Event Types & Triggers
Event Type	Source	Trigger Example	Downstream Actions
New Lead	Webhook (Google Ads, Website)	New form submission	capture_lead → route_lead → send_sms → log_result
New Review	Platform API (Google, Yelp)	Customer review posted	fetch_reviews → analyze_sentiment → reply_review → update_memory
Post Scheduled	User command	“Felix, schedule my fall promo”	generate_post_copy → publish_post → generate_report
Metric Anomaly	LearningLoop evaluator	Engagement drops 20%	detect_trends → recommend_action → send_notification
Periodic Insight	Cron (daily/weekly)	End-of-week recap	generate_report → summarize_history → email_digest
7. Orchestrator Logic
7.1 Planning Loop (Felix’s “reasoning cycle”)

Event intake: normalize input into a task_context object.

Retrieve context: call retrieve_context() from Memory layer.

Select tools: evaluate which AgentKit tools are relevant.

Execute tools sequentially or in parallel.

Collect results + telemetry.

Evaluate via LearningLoop.

Update memory + summarize outcomes.

7.2 Example Flow: “New Lead Detected”
Event: { type: "lead_new", source: "website_form" }

1. Felix retrieves past lead patterns from memory
2. Calls `enrich_lead` to determine urgency & zone
3. Executes `route_lead` (assigns tech)
4. Uses `send_sms` to confirm appointment
5. Logs telemetry to LearningLoop
6. Memory updated with outcome
7. Analytics detects “lead-to-close” trend next cycle

8. Data Flow & Integration Points
Direction	Source → Destination	Payload
Agent → LearningLoop	Felix → /api/events	{ tool, metrics, context, outcome }
LearningLoop → Felix	Evaluator → /feedback	{ signal_type, score, recommendation }
Memory → Agent	Context retrieval	{ summary, preferences, trends }
UI → Core	User action or approval	{ input, confirmation }
