11. State Management
State Type	Description	Storage
Task Context	Temporary state for current reasoning loop	In-memory (Redis)
Agent Memory	Persistent context for users/businesses	Supabase pgvector
Telemetry State	LearningLoop event + evaluator status	Supabase + LearningLoop
UI State	Ephemeral interaction windows	React + shadcn components
12. Error Handling & Recovery
Failure	Response
API error (e.g., Facebook down)	Retry with exponential backoff
LLM timeout	Re-run with cached prompt context
Memory fetch failure	Fallback to minimal system prompt
LearningLoop unavailable	Cache events locally until reconnect
User rejection	Cancel task, log outcome as “manual stop”
13. Security & Compliance
Area	Enforcement
Token security	Encrypted per client in Supabase Vault
Action limits	Safety rails per module (e.g., max 3 posts/day)
Audit logging	Every action & outcome stored immutably
Opt-out	Users can disable auto-execution per channel
Data privacy	Obfuscate all PII in LearningLoop exports
