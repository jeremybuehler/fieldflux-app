# Performance Testing CI/CD Workflow
name: Performance Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly performance tests at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of performance test to run'
        required: true
        default: 'quick'
        type: choice
        options:
        - quick
        - full
        - regression-only
      update_baseline:
        description: 'Update performance baseline'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '18'
  PERF_BASE_URL: 'http://localhost:5000'
  DATABASE_URL: 'postgresql://localhost:5432/fieldflux_test'

jobs:
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fieldflux
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: fieldflux_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for regression analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install performance testing tools
        run: |
          npm install -g artillery k6 lighthouse
          # Install Chrome for Lighthouse
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Setup test database
        run: |
          npm run db:push
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build application
        run: npm run build

      - name: Start application for testing
        run: |
          npm run start &
          sleep 10
          # Verify application is running
          curl -f http://localhost:5000/api/health || exit 1
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run API Load Tests (K6)
        run: npm run perf:api:k6
        continue-on-error: true

      - name: Run Database Performance Tests
        run: npm run perf:db
        continue-on-error: true
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Frontend Bundle Analysis
        run: npm run perf:bundle
        continue-on-error: true

      - name: Run Memory Profiling
        run: npm run perf:memory
        continue-on-error: true
        env:
          PERF_DURATION: "30000"  # 30 seconds for CI

      - name: Run CPU Profiling
        run: npm run perf:cpu
        continue-on-error: true
        env:
          PERF_DURATION: "30000"  # 30 seconds for CI

      - name: Run Regression Tests
        run: npm run perf:regression
        continue-on-error: true
        env:
          UPDATE_BASELINE: ${{ github.event.inputs.update_baseline || 'false' }}

      - name: Generate Performance Report
        run: npm run perf:report
        if: always()

      - name: Upload Performance Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports-${{ github.run_number }}
          path: tests/performance/reports/
          retention-days: 30

      - name: Comment PR with Performance Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'tests/performance/reports/comprehensive/ci-summary.md';
            
            if (fs.existsSync(path)) {
              const report = fs.readFileSync(path, 'utf8');
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🚀 Performance Test Results\n\n${report}\n\n---\n*Results from commit ${context.sha.substring(0, 7)}*`
              });
            }

      - name: Publish Performance Report to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: tests/performance/reports/comprehensive
          destination_dir: performance/${{ github.run_number }}

      - name: Update Performance Dashboard
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          # Create or update performance dashboard index
          mkdir -p gh-pages
          echo "# FieldFlux Performance Dashboard" > gh-pages/index.md
          echo "" >> gh-pages/index.md
          echo "## Latest Reports" >> gh-pages/index.md
          echo "- [Run ${{ github.run_number }}](./performance/${{ github.run_number }}/performance-report.html)" >> gh-pages/index.md

      - name: Notify on Performance Degradation
        if: failure() && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'tests/performance/reports/latest-regression.json';
            
            if (fs.existsSync(reportPath)) {
              const regression = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              
              if (regression.summary.criticalRegressions > 0) {
                github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `🚨 Critical Performance Regression Detected - ${new Date().toISOString().split('T')[0]}`,
                  body: `## Critical Performance Regression Alert
                  
**Commit:** ${context.sha}
**Branch:** ${context.ref}
**Critical Regressions:** ${regression.summary.criticalRegressions}
**Total Regressions:** ${regression.summary.totalRegressions}

### Regressions Detected:
${regression.regressions.filter(r => r.severity === 'high').map(r => 
  `- **${r.metric}**: ${r.changePercent.toFixed(1)}% increase (${r.baseline.toFixed(1)} → ${r.current.toFixed(1)})`
).join('\n')}

**Action Required:** Review and fix performance regressions before deployment.

[View Full Performance Report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                  labels: ['performance', 'critical', 'regression']
                });
              }
            }

  # Separate job for full performance testing (longer running)
  full-performance-tests:
    name: Full Performance Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'full' || github.event_name == 'schedule'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: fieldflux
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: fieldflux_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install performance testing tools
        run: |
          npm install -g artillery k6 lighthouse
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Setup test database
        run: npm run db:push
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          npm run start &
          sleep 10
          curl -f http://localhost:5000/api/health || exit 1
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Full Artillery Load Tests
        run: |
          npm run perf:api
          npm run perf:stress
          npm run perf:spike
        continue-on-error: true

      - name: Run Endurance Tests
        run: npm run perf:endurance
        continue-on-error: true

      - name: Run Extended Memory Profiling
        run: npm run perf:memory
        continue-on-error: true
        env:
          PERF_DURATION: "300000"  # 5 minutes for full test

      - name: Run Extended CPU Profiling
        run: npm run perf:cpu
        continue-on-error: true
        env:
          PERF_DURATION: "300000"  # 5 minutes for full test

      - name: Run Lighthouse Audit
        run: npm run perf:lighthouse
        continue-on-error: true

      - name: Generate Comprehensive Report
        run: npm run perf:report
        if: always()

      - name: Upload Full Performance Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-performance-reports-${{ github.run_number }}
          path: tests/performance/reports/
          retention-days: 90

      - name: Archive Performance Baseline
        if: github.ref == 'refs/heads/main'
        run: |
          # Archive current baseline for historical tracking
          cp tests/performance/reports/baseline.json tests/performance/reports/baseline-$(date +%Y%m%d).json
        continue-on-error: true